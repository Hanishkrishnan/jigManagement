
<div class="view">
  <form [formGroup]="jigForm" (ngSubmit)="create()">
    <h1>Create JIG</h1>
    <label for="projectName">Project</label>

    <select formControlName="projectName">
      <option>IEC</option>
      <option>UL</option>
      <option>CRB</option>
    </select>

    <label for="partName">Part</label>

    <select formControlName="partName">
      <option>FL</option>
      <option>STORE PROC</option>
    </select>

    <label for="quantity">Quantity</label>

    <input type="number" formControlName="quantity"/>

    <button class="btn btn-primary">Create</button>
  </form>
  <div class="viewButton">
    <!-- Changing View based on loggedIn User using custom directive -->
    <button *appHasPermission="['REQUEST_CREATE' , ]">Admin</button>
    <button *appHasPermission="'REQUEST_UPDATE'">Update</button>
    <button *appHasPermission="'REQUEST_DELETE'">Delete</button>
    <button *appHasPermission="'REQUEST_APPROVE'">Approve</button>
    <button *appHasPermission="'REQUEST_READ'">Normal User</button>
    <!-- disable button based on permission -->
    <button>Disable button</button>
  </div>
</div>
