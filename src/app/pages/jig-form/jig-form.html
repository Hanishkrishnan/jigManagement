<app-sidebar></app-sidebar>

<div>
  <h1>Create JIG</h1>

  <form [formGroup]="jigForm" (ngSubmit)="create()">
    <label for="projectName">Project</label>

    <select formControlName="projectName">
      <option>IEC</option>
      <option>UL</option>
      <option>CRB</option>
    </select>

    <label for="partName">Part</label>

    <select formControlName="partName">
      <option>FL</option>
      <option>STORE PROC</option>
    </select>

    <label for="quantity">Quantity</label>

    <input type="number" formControlName="quantity"/>

    <button class="btn btn-primary">Create</button>
  </form>
</div>
