<h2 mat-dialog-title class="dialog-title">New request</h2>

<mat-dialog-content class="dialog-content">
  <form [formGroup]="requestForm">
    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Request code</mat-label>
      <input matInput placeholder="e.g. REQUEST1" formControlName="name" />
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Description</mat-label>
      <textarea matInput rows="2" placeholder="Optional" formControlName="description"> </textarea>
    </mat-form-field>

    <mat-form-field appearance="outline" class="full-width">
      <mat-label>Quantity</mat-label>
      <input matInput type="number" formControlName="quantity" />
    </mat-form-field>
  </form>
</mat-dialog-content>

<mat-dialog-actions class="dialog-actions">
  <button mat-stroked-button (click)="close()">Cancel</button>

  <button mat-flat-button color="primary" (click)="submit()">Create request</button>
</mat-dialog-actions>
