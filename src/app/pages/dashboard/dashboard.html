<app-sidebar></app-sidebar>
  <app-navbar></app-navbar>

<div class="content">
  <!-- <div class="navbar">
    <input type="text" placeholder="Search..." class="search-box" />
  </div> -->
  <h1>Dashboard</h1>

  <p class="breadcrumb">Dashboard > Home</p>

  <div class="cards">
    <div class="card">
      <div class="icon-box blue">
        📁
    </div>
      <h2>{{ newOrders }}</h2>
      <p>New Orders</p>
    </div>

    <div class="card">
      <div class="icon-box yellow">
    🔧
</div>
      
      <h2>{{ visitors }}</h2>
      <p>Visitors</p>
    </div>

    <div class="card">
      <div class="icon-box orange">
    ✔
</div>
      <h2>{{ totalsales }}</h2>
      <p>Total sales</p>
    </div>
  </div>

  <div class="bottom-section">
    <div class="recent-orders">
      <div class="table-header">

    <h2>Recent Orders</h2>

  

</div>

      <table>
        <thead>
          <tr>
            <th>Project Name</th>
            <th>Product</th>
            <th>Quantity</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let order of jigService.orders()">
            <td>{{ order.projectName }}</td>

            <td>{{ order.partName }}</td>
            <td>{{ order.quantity }}</td>


            <td>
              <span
                [ngClass]="{
                  completed: order.status === 'Completed',
                  pending: order.status === 'Pending',
                  process: order.status === 'Process',
                }"
              >
                {{ order.status }}
              </span>
            </td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>
</div>
